// =============================================================================
//  autoexec.cfg — 敵の視認性 優先 / 次にパフォーマンス
//  想定: 高リフレッシュレート環境（144〜360Hz）／ VRAM 8GB以上。数値は各自の環境に合わせて調整する
//  対象: Apex Legends v3.0.1.28  build R5pc_r5-301_J28_CL11570498
//        r5apex_dx12.exe sha256 8bacf98c9409352b198ece7800a09141585a95eaf6f9dc003c0f6c1114ca3825
//
//  【置き方】 r5apex_dx12.exe と同じフォルダに autoexec.cfg として置く（管理者権限）
//            起動オプション:  +exec autoexec.cfg -novid
//            ※ +fps_max を起動オプションに書くとそちらが勝つので書かないこと
//  【編集】   ゲームを終了 → 編集 → 起動。1回に1行だけ変えて比べる
//  ※映像の個別値（テクスチャ/異方性/LOD/デカール/影/ラグドール/死体/SSAO）は
//    videoconfig.txt 側で管理している（ここには重複して書かない＝優先関係が不明になるため）
//  【根拠】   [E]=このビルドのコードが値を読むと実測確認済み / [S]=UIスクリプト側
//            [未]=実在するが読み手未確認 / [CHEAT]=MPでは効かないので使わない
//
//  【方針】   視認性＞性能。なので「軽さのために視界を悪くする」設定は入れていない:
//            ・影は videoconfig.txt 側で管理（既定はオフ: csm_enabled 0 / shadow_enable 0）
//              … 影を残すと敵の影で気づきやすいが、暗部が見にくくなる（好みで 1 に）
//            ・テクスチャは高品質のまま … VRAM 16GBで余裕があり、潰すと遠くが見にくい
//            ・AAは4サンプル（既定64）… 上げすぎると動く敵が尾を引く
//            ・アニメ詳細(cl_anim_detail_dist)は既定のまま … 動きで敵を拾えなくなるため
//
//  【規約の線引】 演出カット（眩しさ/滲み/ブラー/露出/グレイン/自分の銃口フラッシュ）は
//    一般プレイで広く使われているが、規約文言上は「グレー」（これでのBAN確例は未確認）。
//    大会(ALGS)では使用できる設定が限定される。情報量・挙動に触るものは下に ★GRAY 印:
//    ・セーフ側 = 眩しさ/滲み/ブラー/露出/グレイン/自分の銃口フラッシュ = 情報を増やさない
//    ・グレー側 = 霧(fog_enable) と パーティクル早送り(r_particle_timescale)
//      → 「見える距離/煙の晴れ方」に触る。厳格に運用するなら // で切る
// =============================================================================


// =============================================================================
// 1. 敵の視認性 — 眩しさ・濁り・ノイズの除去（本命）
// =============================================================================
r_rimlight "1"                              // 既定=0。キャラ輪郭に光を回す → 敵シルエットが拾いやすい [E]

// 露出を固定（明暗で自動調整されると暗所の敵が沈む）
mat_autoexposure_disable_controllers "1"    // 既定=0。自動露出の追従をOFF [E]
mat_autoexposure_min "1.0"                  // 既定=0.5。下限を上げて暗所を沈ませない [E]
mat_autoexposure_max "2.0"                  // 既定=3。上限を下げて白飛びを防ぐ [E]
mat_autoexposure_compensation "0.5"         // 既定=0。全体をやや持ち上げ [E]
mat_autoexposure_speed "2.0"                // 既定=0.1。変化を速く [E]

// 画面を濁らせるもの・ノイズを消す
mat_bloom_global_baseline "0"               // 既定=0.1。ブルーム（白い滲み）0 [E]
mat_wide_bloom_global_baseline "0"          // 既定=0.4。広域ブルーム＝画面が白む元凶 [E]
mat_bloom_streak_amount "0"                 // 既定=0。光芒 [E]
r_volumetric_lighting_enabled "0"           // 既定=2。光の筋・もやを消す（軽量化も兼ねる） [E]
mat_hide_sun_in_last_cascade "1"            // 既定=0。遠景の太陽グレアを消す [E]
fog_enable "0"                              // ★GRAY 既定=1。霧を切る＝見える距離が伸びる（BAN対象ではないが"情報量"に触る側） [E]
fog_enableskybox "1"                        // 既定=1。空の霧は残す（0だと空が黒くなる） [E]
mat_screen_blur_enabled "0"                 // 既定=1。被弾/ダッシュの画面ブラー除去 [E]
noise_filter_scale "0"                      // 既定=0.006。フィルムグレイン除去 [S]

// 地面のノイズ（弾痕・足跡）を減らす
r_cull_decal_distance_factor "0.5"          // 既定=1.0。デカールを早く消す [E]
r_decal_cover_count "0"                     // 既定=4。上書き数 [E]

// 暗所
gamma_scale "1.15"                          // 既定=1.0。1.1〜1.3が実用域。上げすぎると白が潰れる [E]

// 敵の識別色（読み手未確認。効かなければ消してよい）
// idcolor_enemy "1.0 0.15 0.15 3"          // 既定="0.8 0.25 0.15 3" [未]


// =============================================================================
// 2. 武器・マズルフラッシュ（自分の視界を塞ぐもの）
// =============================================================================
projectile_muzzleOffsetFirstPersonDecayMaxTime "0"   // 既定=0.3。自分の銃口フラッシュを即フェード [E]
projectile_muzzleOffsetFirstPersonDecayDist "0"      // 既定=1000。同上（距離） [E]
viewmodelShake "0"                          // 既定=1。武器の揺れを止める [E]
viewmodelShake_sourceRollRange "0"          // 既定=3。揺れ幅 [E]
shake_viewmodelFactor_ads_human "0"         // 既定=0.01。ADS中の武器振動 [E]
shake_viewmodelFactor_human "0"             // 既定=0.10。通常時の武器振動 [E]
shake_basicPitchFactor "0"                  // 既定=0.20。画面全体のピッチ揺れ [E]
shake_basicRandomRollFactor "0"             // 既定=0.15。画面のランダムロール [E]
viewmodel_selfshadow "0"                    // 既定=1。武器が自分に落とす影を消す [E]
viewmodel_selfshadow_tightbounds "1"        // 既定=1。影の範囲を最適化（保険） [E]
slide_viewTiltSide "0"                      // 既定=15。スライド時の画面の傾きを消す [E]
// r_drawviewmodel は [CHEAT] なので武器非表示にはできない
// ss_viewmodelfov "75"                     // 既定=54。武器を小さく映す [未]


// =============================================================================
// 3. HUD（敵の情報を拾いやすく、画面をゴチャつかせない）
// =============================================================================
hud_setting_showEnemyHighlight "1"          // 既定=1。敵の赤ハイライト（切らない） [S]
hud_setting_showEnemyHealthBar "1"          // 既定=1。クロスヘア下のHPバー [S]
hud_setting_adsDof "0"                      // 既定=1。ADS時のボケを切る＝スコープ中も周囲が見える [S]
hud_setting_pingAlpha "0.3"                 // 既定=1.0。ピン表示を薄くする [S]
hud_setting_compactOverHeadNames "1"        // 既定=0。頭上ネームプレート縮小 [S]
hud_setting_showButtonHints "0"             // 既定=1。ボタンヒント非表示 [S]
hud_setting_damageTextStyle "1"             // 既定=1。0=off/1=積算/2=浮遊/3=両方 [S]
damage_indicator_style_pilot "2"            // 既定=2。被弾方向表示（0=off/1=2D/2=2D+3D） [E]
hud_setting_damageIndicatorStyle "2"        // 既定=2。クロスヘア被弾フィードバック [S]
cl_prevent_weapon_text_hints "1"            // 既定=1。武器ヒント抑制 [E]
player_setting_damage_closes_deathbox_menu "0"  // 既定=1。被弾でデスボックスが閉じない [S]
fov_disableAbilityScaling "1"               // 既定=0。アビリティでFOVが変わらない [E]
// ※ cl_fovScale はここに書かない（profile.cfg が持つ値と食い違うと不整合になる）


// =============================================================================
// 4. パフォーマンス（視界を犠牲にしない範囲で、重い順に削る）
// =============================================================================
// 影: 静的な影（建物など）だけ切る。キャラの影は残す
static_shadow "0"                           // 既定=3。静的影を切る [E]
tweak_light_shadows_every_frame "0"         // 既定=0。毎フレーム更新しない [E]
static_shadow_prop_min_size "40.0"          // 既定=40.0。小物に影を落とさない [E]
// 軽さ最優先なら次を有効化（敵の影も消える）: csm_enabled "0" / shadow_enable "0" / r_cullshadowworldmeshes "0" [E]

// SSAO: 視認性への寄与小・コスト大 → 切る
ssao_blur "0"                               // 既定=1 [E]

// パーティクル（煙が敵を隠す時間を短く）
r_particle_timescale "3"                    // ★GRAY 既定=1.0。煙・エフェクトが早く晴れる＝遮蔽物が早く消える側 [E]
r_particle_lighting_enable "0"              // 既定=1。パーティクルの照明計算を切る [E]
particle_dlights_enable "0"                 // 既定=1。パーティクル発の動的ライトを切る [E]

// 死体・破片・血
g_ragdoll_fadespeed "10000"                 // 既定=600（0はメモリリーク注意） [E]
g_ragdoll_lvfadespeed "10000"               // 既定=100 [E]
cl_phys_maxticks "0"                        // 既定=3 [E]
props_break_max_pieces "0"                  // 既定=-1 [E]。※REPLICATED=サーバー権威なので無効化される可能性あり
func_break_max_pieces "0"                   // 既定=15 [E]。※REPLICATED=サーバー権威なので無効化される可能性あり
violence_ablood "0"                         // 既定=1 [E]
violence_agibs "0"                          // 既定=1 [E]
violence_hblood "0"                         // 既定=1 [E]
violence_hgibs "0"                          // 既定=1 [E]

// その他のエフェクト
cl_drawmonitors "0"                         // 既定=1。ゲーム内モニタの描画 [E]
cl_show_splashes "0"                        // 既定=1。水しぶき [E]
rope_collide "0"                            // 既定=1。ジップの衝突判定 [E]
r_jiggle_bones "0"                          // 既定=1。髪・装飾の揺れ計算 [E]
r_blurmenubg "0"                            // 既定=1。メニュー背景ブラー [E]
cl_fasttempentcollision "3"                 // 既定=5。一時エンティティの衝突簡略化 [E]

// 描画距離/LOD（ゴチャつきも減る）
shader_lod_world_mesh_scaled_dist "2500"    // 既定=4000。草・岩・装飾を落とす距離 [E]
staticProp_max_scaled_dist "1800"           // 既定=2500。小物を表示する距離 [E]

// テクスチャ/ストリーミング（VRAM 16GB を活かす）
stream_drop_unused "1"                      // 既定=0。未使用テクスチャを解放 [E]
stream_cache_preload_from_rpak "1"          // 既定=1 [E]
// [読み手未確認のため無効] stream_cache_high_priority_static_models "1"// 静的モデルを優先ロード [未]

// TSAA（アンチエイリアス）
tsaa_numsamples "4"                         // 既定=64。動く敵の尾引きが減る＋軽い [E]
tsaa_curframeblendamount "0.05"             // 既定=0.05 [E]
tsaa_blendfactoroverride "1"                // 既定=-1 [E]

// スレッド（8C16T を活かす。既定で有効なので明示）
cl_threaded_bone_setup "1"                  // 既定=1 [E]
cl_async_bone_setup "1"                     // 既定=1 [E]
r_threaded_particles "1"                    // 既定=1 [E]
cl_parallelParticlePreDrawWork "1"          // 既定=1 [E]
cl_parallel_clientside_animations "1"       // 既定=1 [E]
cl_precache_use_pso_threads "1"             // 既定=1 [E]
leaf_threadedRecompute "1"                  // 既定=1 [E]

// 入力・遅延（AMD環境）
m_acceleration "0"                          // 既定=0。マウス加速オフ [E]
gfx_amdUseLowLatency "1"                    // 既定=1。AMD Anti-Lag [E]
in_usekeyboardsampletime "1"                // 既定=1。低遅延の入力タイムスタンプ方式 [E]
// gfx_nvnUseLowLatency / Boost はNVIDIA用。AMDでは無効（害はない）

// フレームレート: モニタ 360Hz 想定で 357（VRRなら -3 程度）。自分の平均FPSに合わせて
//   調整（目安: 平均＋少し上）。各自の fps 切替バインドで上書きしてよい
fps_max "357"                               // 既定=-1(無制限) [E]


// =============================================================================
// 5. 音（敵の足音を拾いやすく）
// =============================================================================
miles_channels "2"                          // 既定=0(自動)。ステレオ固定 [E]
cl_footstep_event_max_dist "5000"           // 既定=4000。足音の可聴距離を伸ばす [E]
rope_wind_dist "4000"                       // 既定=1000。ジップの風切り音を遠くまで [E]
sound_volume_music_game "0"                 // 既定=1。試合中の音楽オフ [S]
sound_volume_music_lobby "0"                // 既定=1。ロビー音楽オフ [S]
sound_without_focus "1"                     // 既定=0。タブ外でも音を鳴らす [S]


// =============================================================================
// 6. 好み（視認性・性能とは無関係）
// =============================================================================
player_setting_autosprint "1"               // 既定=0。オートスプリント [S]
hud_setting_minimapRotate "1"               // 既定=0。ミニマップ回転 [S]
weapon_setting_autocycle_on_empty "1"       // 既定=1。弾切れで自動切替 [S]
ordnanceSwapSelectCooldown "0"              // 既定=0.25。グレネード切替の待ち0 [E]
sidearmSwapSelectCooldown "0"               // 既定=0.25。武器切替の待ち0 [E]
cl_matchmaking_timeout "100"                // 既定=1。マッチングのタイムアウト [E]
cl_ranked_reconnect_timeout "300"           // 既定=15。ランク再接続の猶予 [E]
telemetry_client_enable "0"                 // 既定=1。テレメトリ停止 [E]
telemetry_client_sendInterval "0"           // 既定=10.0 [E]
pin_opt_in "0"                              // 既定=1。EA調査を拒否 [S]
pin_plat_id "0"                             // 既定=0 [E]
// [読み手未確認のため無効] chroma_enable "0"                           // 既定=1。周辺機器ライトの反応を切る [未]


// =============================================================================
// 7. 未計測の軽量化候補（効果を確かめてから有効化する）
// =============================================================================
// r_terrainVirtualTextureCompositeTilesPerFrameMax "2"   // 既定=6。地形テクスチャ合成量 [E]
// r_terrainShaderLODDist "20000"                          // 既定=100000。遠景地形LOD [E]
// r_terrainDynamicLightMaxCount "128"                     // 既定=512 [E]
// stream_cache_read_count_cap "12"                        // 既定=24。同時読み込み数 [E]
// stream_low_mips_to_batch "0"                            // 既定=2 [E]
// r_drawDecals "0"                                        // デカール描画ON/OFF（既定値不明） [未]


// =============================================================================
// 8. 使えない / 効かない（書いても無反応）
// =============================================================================
// [CHEAT]（MPでは sv_cheats が必要）: mat_fullbright r_drawsky mat_postprocess_enable
//   mat_disable_lightmaps nx_static_lobby_mode host_sleep r_drawviewmodel ほか
//   → 全リスト: out\CVAR-LIST-FULL.md
// このビルドに存在しない名前（旧Source/コミュニティ由来）: m_rawinput snd_mixahead cl_interp
//   mat_antialias r_shadows mat_queue_mode cl_cmdrate cl_timeout net_compresspackets
//   cl_ejectbrass r_cleardecals mat_disable_bloom ほか83項目
// 効果不明（コードが値を読んでいないと実測）: cl_particle_fallback_base/multiplier,
//   r_norefresh, cl_lagcompensation, sound_num_speakers, chroma_enable, match_updateRate
