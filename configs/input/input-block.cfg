// =============================================================================
//  input-block.cfg — マウス/パッド入力の整理ブロック
//  【使い方】この中身を自分の autoexec.cfg の末尾に「貼り付ける」
//    ※ 別ファイルにして +exec で読みに行く方式は使わないこと
//      （2024/2 にRespawnが +exec によるcfgチェーンを無効化している）
//  【根拠】r5apex_dx12.exe v3.0.1.28 の静的解析
//    マウスの感度計算関数 0x1409b6e10 が読むcvarは以下の5系統だけ:
//      mouse_sensitivity / mouse_use_per_scope_sensitivity_scalars /
//      mouse_zoomed_sensitivity_scalar_0..7 / m_acceleration / mirror_main_scene
//    パッドのlook処理 0x1408a5350 とは相互参照が無い（＝パッド設定がこの関数に
//    直接入る経路は見つかっていない）。以下はその実測に沿った内容。
// =============================================================================

// ── 1. マウス（この3行がマウス挙動の全レバー） ─────────────────────────────
// マウス加速。既定 0。0以外にするとマウスデルタが sqrt 正規化される（=加速が入る）
m_acceleration 0

// スコープ/倍率ごとの感度スカラーを使うか。既定 0（=使わない）
// 1 にすると下の mouse_zoomed_sensitivity_scalar_* が効く
mouse_use_per_scope_sensitivity_scalars 0

// 左右反転フラグ。既定 0（=通常）
mirror_main_scene 0

// ── 2. 倍率ごとのマウス感度（1 のスカラーを使う場合のみ意味がある） ─────────
// 既定はすべて 1.0。1.0 のままなら「どのスコープでも同じ感度」＝素直な状態
// 例: 2倍サイトだけ 0.9 にしたい時は scalar_1 を 0.9 にする
// （use_per_scope_sensitivity_scalars 0 の間は、ここを変えても無効）
// mouse_zoomed_sensitivity_scalar_0 1.0
// mouse_zoomed_sensitivity_scalar_1 1.0
// mouse_zoomed_sensitivity_scalar_2 1.0
// mouse_zoomed_sensitivity_scalar_3 1.0
// mouse_zoomed_sensitivity_scalar_4 1.0
// mouse_zoomed_sensitivity_scalar_5 1.0
// mouse_zoomed_sensitivity_scalar_6 1.0
// mouse_zoomed_sensitivity_scalar_7 1.0

// ── 3. パッド（マウスには影響しない。パッド入力を完全に無効化したい人向け） ──
// 倍率ごとのパッド感度スカラーを使うか。既定 0（=使わない）
gamepad_use_per_scope_sensitivity_scalars 0

// パッドのADS(覗き込み)感度スカラー。既定は全スロット 1.0
// （小さくするとパッドADSが鈍くなる。マウス操作には影響しない）
gamepad_ads_advanced_sensitivity_scalar_0 1.0
gamepad_ads_advanced_sensitivity_scalar_1 1.0
gamepad_ads_advanced_sensitivity_scalar_2 1.0
gamepad_ads_advanced_sensitivity_scalar_3 1.0
gamepad_ads_advanced_sensitivity_scalar_4 1.0
gamepad_ads_advanced_sensitivity_scalar_5 1.0
gamepad_ads_advanced_sensitivity_scalar_6 1.0
gamepad_ads_advanced_sensitivity_scalar_7 1.0

// パッドのエイムアシスト。既定はすべて 1。0 = 切り（パッド使用時は明確に不利になる）
// ※ マウスには元々適用されない。マウス勢には実質ノーオペレーション
gamepad_aim_assist_ads_high_power_scopes 0
gamepad_aim_assist_ads_low_power_scopes 0
gamepad_aim_assist_hip_high_power_scopes 0
gamepad_aim_assist_hip_low_power_scopes 0
gamepad_aim_assist_melee 0

// パッドのADS目標速度。-1 = ヒップ値の継承（既定 -1）
gamepad_aim_speed_ads_0 -1
gamepad_aim_speed_ads_1 -1
gamepad_aim_speed_ads_2 -1
gamepad_aim_speed_ads_3 -1
gamepad_aim_speed_ads_4 -1
gamepad_aim_speed_ads_5 -1
gamepad_aim_speed_ads_6 -1
gamepad_aim_speed_ads_7 -1

// ── 4. 参考: 書いても効かない可能性が高いもの（実測） ─────────────────────
// joystick 0
//   → このビルドの exe / 同梱DLL に "joystick" の文字列が1つも無い
//     （=静的に登録された cvar ではない）。settings.cfg にゲーム自身が書く「キー」
//     としてのみ存在する。コミュニティcfgの定番行だが、実体は旧Source時代の名残。
// disable_mouselook 0
//   → 文字列は存在する（exe 0x18bf570）。0 = 通常。触る必要はない。
